name: dist

# Publishes the plugin build (static binaries, shim, hooks, manifest) as a
# single orphan commit on the dist branch, which the marketplace manifest on
# main points at. Runs are serialized; a newer push cancels an older run.

on:
  push:
    branches: [main]

concurrency:
  group: dist
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  dist:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_seq is the commit count, so the history must be complete
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.x
      - name: Test
        run: go test ./...
      - name: Build dist tree
        run: sh scripts/build-dist.sh "$RUNNER_TEMP/dist"
      - name: PII scan of the dist tree
        run: go run ./tools/piiscan --allowlist testdata/pii-allowlist.txt "$RUNNER_TEMP/dist"
      - name: Publish
        run: |
          set -eu
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote" != "$GITHUB_SHA" ]; then
            echo "main is now ${remote:-unknown}, not $GITHUB_SHA: this build is stale, not publishing"
            exit 0
          fi
          git checkout --orphan dist-publish
          git rm -rf --quiet .
          cp -R "$RUNNER_TEMP/dist/." .
          git add -A -f
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "dist: build of $GITHUB_SHA"
          git push --force origin HEAD:refs/heads/dist
